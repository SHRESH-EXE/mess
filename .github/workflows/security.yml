# 19 & 20. Enterprise CI/CD Automated Security Pipeline
# Combines GitHub CodeQL, Semgrep OSS, TruffleHog Secret Scanner, and npm audit

name: Security & SAST Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly security scans every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 19A. Secret Leak Scanner (TruffleHog OSS)
  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Repository for Leaked Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # 19B. Semgrep OSS (OWASP Top 10 Static Application Security Testing)
  semgrep:
    name: Semgrep OSS SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Semgrep OWASP Top 10 Ruleset
        run: semgrep scan --config auto --sarif --output semgrep.sarif || true

      - name: Upload Semgrep SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # 19C. GitHub CodeQL SAST Analysis
  codeql:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # 18 & 20. Dependency Vulnerability Audit
  dependency-audit:
    name: npm Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Audit Production Dependencies
        run: npm audit --audit-level=high --omit=dev
